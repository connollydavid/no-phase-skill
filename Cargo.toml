[package]
name = "host-lint"
version = "0.19.0"
edition = "2021"
description = "Detect phase-synonym agentic tells in commits, headers, and comments"
license = "Unlicense"

# The workspace carries the external packs beside the core (host-lint#22,
# workspace-split): lockstep versions, one lockfile, one vendored bundle.
# default-members lists both so a bare `cargo build` produces the pack binary
# too — a root-package workspace would otherwise build only the root.
[workspace]
members = ["host-lint-ffmpeg", "host-lint-openwrt"]
# host-lint-openwrt is a member but NOT a default member while its lanes are being
# built (plan/0081): the canonical artifact is what a bare `cargo build --release`
# produces, and adding a binary to that set would change the hash `--verify-build`
# re-derives. It joins default-members with its first working lane.
default-members = [".", "host-lint-ffmpeg"]

[dependencies]
host-grammar = { git = "https://github.com/connollydavid/host-grammar", rev = "e5ac04cbf8b220786e6e06e65de08e28426e9dab" }

# `cargo kani` sets cfg(kani) for the #[cfg(kani)] proof harnesses in src/lib.rs.
# Declare it a known cfg so the normal build doesn't warn. Lints don't affect
# codegen, so the release artifact stays byte-identical. The canonical artifact is
# built in the digest-pinned muslrust image with locked deps and recorded in
# .host-software (agentic-host), where `host-lifecycle software --verify-build`
# re-derives it byte-for-byte at re-pin; the release CI builds the published
# linux-amd64 asset by the same pinned recipe so the two match.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
proptest = "1.5"

# Reproducible builds: strip symbols and the .comment section (which embed the build
# host's toolchain/distro). Combined with --build-id=none (.cargo/config.toml), the
# release binary carries no build-environment metadata, so it hashes the same anywhere.
[profile.release]
strip = true
